spring.application.name=carclinic
server.port=8080
logging.level.root=DEBUG

# Database Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/carclinic
spring.datasource.username=carclinic
spring.datasource.password=carclinic
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop

# Security Configuration
# issuer-uri must match the "iss" claim in tokens as issued to the browser (via VITE_KEYCLOAK_URL).
# jwk-set-uri is where this backend itself fetches signing keys from, which can be a different
# (e.g. Docker-internal) host than the one browsers use. Kept separate so the two can diverge
# when the backend and the browser reach Keycloak through different hostnames.
app.keycloak.issuer-uri=http://localhost:8180/realms/carclinic
app.keycloak.jwk-set-uri=http://localhost:8180/realms/carclinic/protocol/openid-connect/certs

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
