[project]
name = "api-tests"
version = "0.1.0"
description = "API/integration tests for the Car Clinic microservices"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
