services:
  customer-db:
    image: postgres:16-alpine
    container_name: customer-db
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    ports:
      - "5432:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer -d customerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    container_name: customer-service
    environment:
      DB_HOST: customer-db
      DB_PORT: 5432
      DB_NAME: customerdb
      DB_USERNAME: customer
      DB_PASSWORD: customer
    ports:
      - "8080:8080"
    depends_on:
      customer-db:
        condition: service_healthy

  vehicle-db:
    image: postgres:16-alpine
    container_name: vehicle-db
    environment:
      POSTGRES_DB: vehiclesdb
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: vehicle
    ports:
      - "5434:5432"
    volumes:
      - vehicle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle -d vehiclesdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  vehicle-service:
    build:
      context: .
      dockerfile: vehicle-service/Dockerfile
    container_name: vehicle-service
    environment:
      DB_HOST: vehicle-db
      DB_PORT: 5432
      DB_NAME: vehiclesdb
      DB_USERNAME: vehicle
      DB_PASSWORD: vehicle
    ports:
      - "8081:8080"
    depends_on:
      vehicle-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ./keycloak
    container_name: carclinic-keycloak
    restart: always
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  customer-db-data:
  vehicle-db-data:
  keycloak-db-data:
