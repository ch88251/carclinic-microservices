name: customer-service

on:
  push:
    branches:
      - main
    paths:
      - "carclinic-microservices/customer-service/**"
      - ".github/workflows/customer-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "carclinic-microservices/customer-service/**"
      - ".github/workflows/customer-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carclinic-microservices/customer-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: carclinic-microservices/customer-service/build.gradle.kts

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Backend
        run: ./gradlew clean build

      - name: Upload Backend HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: carclinic-microservices/customer-service/build/reports/tests/test/
          retention-days: 14